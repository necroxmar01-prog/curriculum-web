<div class="habilidades-container">

  <div class="page-header">
    <h1>Habilidades & Herramientas</h1>
    <p>Tecnologías y herramientas con las que he trabajado</p>
  </div>

  <div class="categorias-grid">
    @for (cat of categorias; track cat.titulo) {
      <div class="card">

        <div class="card-header">
          <span class="cat-icon">{{ cat.icono }}</span>
          <h3 [style.color]="cat.color">{{ cat.titulo }}</h3>
        </div>

        <div class="habilidades-list">
          @for (hab of cat.habilidades; track hab.nombre) {
            <div class="habilidad-item">
              <div class="hab-header">
                <span class="hab-nombre">{{ hab.nombre }}</span>
                <span class="hab-nivel">{{ hab.nivel }}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill"
                     [style.width]="hab.nivel + '%'"
                     [style.background]="cat.color">
                </div>
              </div>
            </div>
          }
        </div>

      </div>
    }
  </div>

</div>
